<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5566">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="הטיול הגדול">
<title>הטיול הגדול</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a travel magazine written about the two of you — confident, literate, calm
   IDEA: every screen is a page of an issue; headlines are live sentences about your trip
   PICTURE: the Patagonia-at-dusk cover, full bleed, with the countdown set in a heavy serif
   COLOUR and TYPE: white paper, ink black, lagoon teal, one coral accent; Frank Ruhl Libre display + Heebo text
   LAYOUT: 600px column, heavy rules and hairlines, cover + contents hub, 4 text tabs */
:root{color-scheme:light dark;--paper:light-dark(#ffffff,#0f1113);--ink:light-dark(#111418,#f1f1ee);--soft:light-dark(#f3f4f2,#181b1e);
--hair:light-dark(#dcdedb,#2b2f34);--mute:light-dark(#5d636a,#a3a7ad);--sea:light-dark(#0b5566,#63c2d4);--acc:#ff5a36;--good:light-dark(#0d7a4f,#4fd39a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 Heebo,system-ui,sans-serif;overflow-x:clip}
.app{max-width:600px;margin:0 auto;padding:0 20px 120px}
.sf{font-family:'Frank Ruhl Libre',Georgia,serif}
h1,h2,h3{font-family:'Frank Ruhl Libre',Georgia,serif;margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(42px,12vw,64px);font-weight:900;letter-spacing:-.5px}
h2{font-size:clamp(30px,8.5vw,42px);font-weight:700}
h3{font-size:22px;font-weight:700}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums lining-nums;white-space:nowrap}
.kick{font-size:13px;font-weight:600;color:var(--acc);letter-spacing:.2px}
.deck{font-size:18px;line-height:1.55;color:var(--mute);margin:12px 0 0;max-width:34em}
.deck b{color:var(--ink);font-weight:600}
.mute{color:var(--mute)}.sm{font-size:14px}.xs{font-size:13px;color:var(--mute)}
.rule{border:0;border-top:3px solid var(--ink);margin:0}.hair{border:0;border-top:1px solid var(--hair);margin:0}
.hero{position:relative;margin:0 -20px;color:#fff;height:min(88vh,640px);min-height:520px;overflow:hidden;text-shadow:0 1px 18px rgba(0,0,0,.35)}
.hero svg.beach{position:absolute;inset:0;width:100%;height:100%;display:block}
.hov{position:absolute;inset:0;padding:22px 20px 26px;display:flex;flex-direction:column}
.hm{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-bottom:10px;border-bottom:3px solid #fff}
.hmeta{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding-top:8px}
.hb{margin-top:auto}.hb .cd{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:clamp(104px,32vw,160px);line-height:.85;letter-spacing:-3px}
.hb .cl{font-family:'Frank Ruhl Libre',serif;font-size:26px;font-weight:500;margin-top:10px}.hb .tag{font-size:14px;margin-top:6px;opacity:.95}
.hero .av{border-color:#fff;color:#fff;background:rgba(0,0,0,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-shadow:none}
@media(prefers-reduced-motion:no-preference){.foam{animation:foam 5s ease-in-out infinite alternate}@keyframes foam{to{transform:translateX(-14px);opacity:.6}}
 .glint{animation:glint 3.5s ease-in-out infinite alternate}@keyframes glint{to{opacity:.45}}
 .boat{animation:bob 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes bob{to{transform:translateY(3px) rotate(-1deg)}}}
.ck{transition:background .15s,transform .15s}
body.ck-circle .ck{border-radius:50%;border-color:var(--sea)}body.ck-circle .ck.on{background:var(--sea);border-color:var(--sea)}
body.ck-coral .ck{border-radius:8px;border-color:var(--acc)}body.ck-coral .ck.on{background:var(--acc);border-color:var(--acc)}body.ck-coral .ck svg{color:#fff}
body.ck-stamp .ck{border-radius:50%;border:2px dashed var(--mute)}body.ck-stamp .ck.on{background:transparent;border:2.5px solid var(--acc);transform:rotate(-12deg)}body.ck-stamp .ck.on svg{color:var(--acc);stroke-width:3.2}
body.ck-circle .ck.on svg{color:#fff}
.styles{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.styles button{display:flex;align-items:center;gap:8px;border:1px solid var(--hair);background:transparent;color:var(--ink);padding:6px 12px;min-height:44px;border-radius:2px;font-size:14px}
.styles button.on{border:1.5px solid var(--ink)}
.styles .ck{pointer-events:none}
.styles button.ck-sq .ck.on{border-radius:2px;background:var(--ink);border:1.5px solid var(--ink);transform:none}.styles button.ck-sq .ck.on svg{color:var(--paper)}
.styles button.ck-circle .ck.on{border-radius:50%;background:var(--sea);border:1.5px solid var(--sea);transform:none}.styles button.ck-circle .ck.on svg{color:#fff}
.styles button.ck-coral .ck.on{border-radius:8px;background:var(--acc);border:1.5px solid var(--acc);transform:none}.styles button.ck-coral .ck.on svg{color:#fff}
.styles button.ck-stamp .ck.on{border-radius:50%;background:transparent;border:2.5px solid var(--acc);transform:rotate(-12deg)}.styles button.ck-stamp .ck.on svg{color:var(--acc)}
body .ck:not(.on) svg{opacity:.2;color:var(--mute)}
body.ck-circle .ck:not(.on){border:2px solid color-mix(in srgb,var(--sea) 45%,transparent)}
body.ck-coral .ck:not(.on){border:2px solid color-mix(in srgb,var(--acc) 55%,transparent)}
.ck:active{transform:scale(.9)}
.dates{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;margin-top:12px;padding:10px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.dates b{display:block;font-family:'Frank Ruhl Libre',serif;font-size:19px;font-weight:700}
.ed2{grid-column:1/-1;display:grid;gap:14px;margin-top:14px;padding:16px;background:var(--soft)}
.ed2 label{display:grid;gap:2px;font-size:13px;font-weight:600;color:var(--mute)}
.ed2 .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.ed2 input,.ed2 select{color:var(--ink);font-weight:400}
.hero .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;display:block;background:#1d8a9a}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,30,40,.62) 0%,rgba(4,30,40,.12) 28%,rgba(4,30,40,0) 50%,rgba(4,30,40,.25) 68%,rgba(4,30,40,.78) 100%)}
@media(prefers-reduced-motion:no-preference){.hero .bgimg{animation:kb 22s ease-in-out infinite alternate}@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.1) translateY(-1.5%)}}}
.tag{display:inline-block;font:600 11px Heebo,sans-serif;color:#fff;background:var(--sea);padding:1px 7px;border-radius:99px;vertical-align:2px}
.owe{margin-top:22px;padding:18px;background:var(--soft);display:grid;gap:6px}.owe b{font-family:'Frank Ruhl Libre',serif;font-size:22px}.owe .btn{margin-top:8px;min-height:46px}
.flf{display:grid;gap:12px;margin-top:16px;padding:16px;background:var(--soft)}.flf .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
nav{padding-bottom:env(safe-area-inset-bottom)}.hov{padding-top:max(22px,env(safe-area-inset-top))}.ph{padding-top:max(26px,env(safe-area-inset-top))}
/* masthead */
.mast{padding:22px 0 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.mast .who{font-size:13px;color:var(--mute);text-align:left;line-height:1.4}
.meta{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:13px;color:var(--mute);border-bottom:1px solid var(--hair)}
.av{border:1px solid var(--ink);background:transparent;color:var(--ink);font:600 13px Heebo,sans-serif;border-radius:99px;padding:6px 14px;min-height:36px;cursor:pointer;white-space:nowrap}
.av::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--hair);margin-inline-end:7px;vertical-align:1px}
.av.ok::before{background:var(--good)}
/* cover */
.cover{position:relative;margin:18px -20px 0;color:#fff;overflow:hidden}
.cover svg.scene{display:block;width:100%;height:clamp(300px,82vw,420px)}
.cover .ov{position:absolute;inset:0;padding:22px 20px;display:flex;flex-direction:column}
.cover .cd{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:clamp(96px,30vw,150px);line-height:.85;letter-spacing:-3px}
.cover .cl{font-family:'Frank Ruhl Libre',serif;font-size:24px;font-weight:500;margin-top:8px}
.cover .tag{margin-top:auto;font-size:14px;opacity:.9}
.lines{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--hair)}
.lines div{padding:16px 0 16px}.lines div+div{border-inline-start:1px solid var(--hair);padding-inline-start:14px}
.lines b{display:block;font-family:'Frank Ruhl Libre',serif;font-size:clamp(22px,6.4vw,30px);font-weight:700;line-height:1.1}
/* contents */
.tocs{display:grid;gap:12px;margin-top:16px}
.toc{display:flex;gap:16px;align-items:flex-start;padding:18px;background:var(--soft);border-radius:6px;text-decoration:none;color:var(--ink);position:relative;transition:transform .15s}
.toc:active{transform:scale(.985)}
.toc::after{content:"←";position:absolute;top:16px;left:18px;font-size:18px;color:var(--mute)}
.toc .t{flex:1;padding-left:22px}.toc h3{margin:3px 0 10px;font-size:clamp(20px,5.6vw,24px)}
.toc.feat{background:var(--ink);color:var(--paper)}.toc.feat .xs,.toc.feat::after{color:color-mix(in srgb,var(--paper) 65%,transparent)}.toc.feat .mbar{background:color-mix(in srgb,var(--paper) 20%,transparent)}.toc.feat .mbar i{background:var(--acc)}
.th{width:52px;height:52px;border-radius:4px;display:grid;place-items:center;flex:none;color:#fff}.th svg{width:26px;height:26px;stroke-width:1.6}
.th-sea{background:var(--sea)}.th-acc{background:var(--acc)}.th-ink{background:#2c3a40}.th-sand{background:#d9a35f}
.mini{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:14px;font-weight:600}.mbar{flex:1;height:5px;border-radius:9px;background:var(--hair);overflow:hidden}.mbar i{display:block;height:100%;background:var(--sea);border-radius:9px}
.stops{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:13px}.stops span{background:var(--paper);border:1px solid var(--hair);padding:3px 10px;border-radius:99px;white-space:nowrap}.stops b{color:var(--acc);font-weight:700}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:40px;padding-bottom:10px;border-bottom:3px solid var(--ink)}
.sechead h3{font-size:24px}
.tlink{background:none;border:0;padding:8px 0;min-height:44px;color:var(--ink);font:500 15px Heebo,sans-serif;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--acc);text-decoration-thickness:2px;cursor:pointer}
/* page head */
.ph{padding:26px 0 18px;border-bottom:3px solid var(--ink)}
.ph .back{display:inline-flex;align-items:center;gap:6px;color:var(--mute);text-decoration:none;font-size:14px;margin-bottom:14px;min-height:32px}
.figure{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:clamp(56px,17vw,88px);line-height:.95;letter-spacing:-1.5px;margin-top:22px}
/* rows */
.r{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--hair);min-height:60px}
.r .t{flex:1}.r .t small{display:block;font-size:13px;color:var(--mute)}
.r .v{font-family:'Frank Ruhl Libre',serif;font-size:20px;font-weight:700}
.lead{flex:1;border-bottom:1px dotted var(--hair);margin:0 6px;align-self:center;height:1px}
input,select{font:17px Heebo,sans-serif;min-height:44px;padding:8px 2px;border:0;border-bottom:1.5px solid var(--ink);border-radius:0;background:transparent;color:var(--ink);width:100%}
.r input,.r select{width:120px;text-align:left;direction:ltr}.r input[type=date]{width:150px}
input:focus,select:focus{outline:none;border-bottom-color:var(--acc);border-bottom-width:2.5px}
button{font:500 16px Heebo,sans-serif;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:2px;background:var(--ink);color:var(--paper);font-size:17px;font-weight:600}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.ck{width:26px;height:26px;border:1.5px solid var(--ink);border-radius:2px;background:transparent;display:grid;place-items:center;padding:0;color:var(--paper);flex:none}
.ck svg{width:16px;height:16px;stroke-width:2.8;opacity:0}.ck.on{background:var(--ink)}.ck.on svg{opacity:1}
.done .t{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--acc)}
.fr{min-width:32px;height:32px;border-radius:99px;border:1px dashed var(--mute);background:transparent;color:var(--mute);font-size:13px;padding:0 8px;flex:none}
.fr.on{border:1px solid var(--sea);background:var(--sea);color:var(--paper)}
.del{border:0;background:none;color:var(--acc);font-size:14px;font-weight:600;padding:0 4px;min-height:44px;flex:none}
.add{display:flex;gap:12px;align-items:flex-end;padding:16px 0;border-bottom:1px solid var(--hair)}
.add button{flex:none;border:0;background:var(--ink);color:var(--paper);min-height:44px;padding:0 18px;border-radius:2px}
.tabs{display:flex;gap:22px;margin-top:20px;border-bottom:1px solid var(--hair)}
.tabs button{border:0;background:none;padding:10px 0 12px;color:var(--mute);font:600 17px Heebo,sans-serif;border-bottom:3px solid transparent;margin-bottom:-1px;min-height:44px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.bar{height:4px;background:var(--hair);margin-top:14px}.bar i{display:block;height:100%;background:var(--ink)}.bar i.acc{background:var(--acc)}.bar i.good{background:var(--good)}
.quote{font-family:'Frank Ruhl Libre',serif;font-size:21px;line-height:1.4;border-inline-start:3px solid var(--acc);padding:2px 16px 2px 0;margin:28px 0}
/* route */
.leg{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 16px;padding:20px 0;border-bottom:1px solid var(--hair)}
.leg .n{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:44px;line-height:.9;color:var(--sea)}
.leg .fit{font-size:13px;font-weight:600}
.ed{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) 80px;gap:10px 14px;margin-top:10px}.ed .w{grid-column:1/-1}
.cal{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.cal th{font-weight:500;color:var(--mute);padding:6px 0;text-align:center}.cal th.me{color:var(--acc);font-weight:700}
.cal th:first-child,.cal td:first-child{text-align:start;width:38%;padding-inline-end:8px}
.cal td{padding:7px 1px;border-top:1px solid var(--hair);text-align:center}
.cal td i{display:block;height:12px;border-radius:2px;background:var(--soft)}.cal td i.s2{background:var(--sea)}.cal td i.s1{background:color-mix(in srgb,var(--sea) 35%,transparent)}
details{border-bottom:1px solid var(--hair)}summary{list-style:none;cursor:pointer;padding:18px 0;display:flex;align-items:center;gap:10px;font:600 17px Heebo,sans-serif;min-height:58px}
summary::-webkit-details-marker{display:none}summary .pm{margin-inline-start:auto;font-family:'Frank Ruhl Libre',serif;font-size:26px;font-weight:400;line-height:1;transition:transform .2s}details[open] summary .pm{transform:rotate(45deg)}
.dbody{padding-bottom:18px}
/* trip */
.chart{display:flex;align-items:flex-end;gap:5px;height:84px;margin-top:22px;border-bottom:1.5px solid var(--ink)}
.chart div{flex:1;height:100%;display:flex;align-items:flex-end}.chart i{display:block;width:100%;background:var(--hair);min-height:2px}.chart i.v{background:var(--ink)}.chart i.over{background:var(--acc)}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--hair);border-inline-start:1px solid var(--hair)}
.cats button{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;border-bottom:1px solid var(--hair);border-inline-end:1px solid var(--hair);background:transparent;color:var(--mute);padding:14px 2px;font-size:14px;min-height:78px;border-radius:0}
.cats button.on{background:var(--ink);color:var(--paper)}
.who{display:flex;border:1.5px solid var(--ink);margin-top:14px}.who button{flex:1;border:0;background:transparent;color:var(--ink);min-height:46px;border-radius:0}.who button+button{border-inline-start:1.5px solid var(--ink)}.who button.on{background:var(--ink);color:var(--paper)}
/* nav, fab, sheet */
nav{position:fixed;bottom:0;inset-inline:0;z-index:30;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1.5px solid var(--ink)}
nav .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0 12px}
nav a{display:flex;justify-content:center;align-items:center;min-height:62px;color:var(--mute);text-decoration:none;font:600 17px 'Frank Ruhl Libre',serif;position:relative}
nav a.on{color:var(--ink)}nav a.on::after{content:"";position:absolute;top:-1.5px;inset-inline:22%;height:4px;background:var(--acc)}
.fab{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:25;height:54px;padding:0 28px;border:0;border-radius:2px;background:var(--ink);color:var(--paper);font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 10px 24px rgba(0,0,0,.18)}
.fab[hidden]{display:none}
.scrim{position:fixed;inset:0;background:rgba(10,12,14,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:41;max-width:600px;margin:0 auto;background:var(--paper);border-top:3px solid var(--ink);padding:20px 20px 26px;transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility .3s;max-height:92vh;overflow:auto}
.open .scrim{opacity:1;pointer-events:auto}.open .sheet{transform:none;visibility:visible}
.amt{display:flex;align-items:flex-end;gap:14px;margin:10px 0 20px}
.amt input{font:900 52px 'Frank Ruhl Libre',serif;text-align:center;direction:ltr;min-height:76px}
.amt input::-webkit-inner-spin-button,.amt input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.amt input{-moz-appearance:textfield}
.amt select{width:84px;font-size:20px;font-weight:600}
.toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-30px);background:var(--ink);color:var(--paper);padding:10px 20px;font-size:15px;opacity:0;transition:.25s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{padding:28px 0;color:var(--mute);font-family:'Frank Ruhl Libre',serif;font-size:20px}
@media(prefers-reduced-motion:no-preference){.plane{animation:fly 9s ease-in-out infinite alternate}@keyframes fly{from{offset-distance:12%}to{offset-distance:88%}}
 .rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}@keyframes rise{from{opacity:0;transform:translateY(14px)}}}
@media(prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
@media(max-width:370px){.r input,.r select{width:100px}nav a{font-size:16px}}
</style>
</head>
<body>
<main class="app"><div id="view"></div></main>
<button class="fab" id="fab" hidden></button>
<div><div class="scrim" data-close></div>
<form class="sheet" id="exf" aria-label="הוצאה חדשה">
  <div style="display:flex;justify-content:space-between;align-items:baseline"><h3>הוצאה חדשה</h3><button type="button" class="tlink" data-close>סגירה</button></div>
  <div class="amt"><input name="a" type="text" inputmode="decimal" data-fmt placeholder="0" required aria-label="סכום" autocomplete="off"><select name="c" id="cur" aria-label="מטבע"></select></div>

 return ph('יומן הוצאות','היום',deck)+
 `<div class="figure num rise d1">${ils(tdy)}</div><div class="xs">הוצאות היום, שניכם · תקציב ${ils(bud*2)}</div>
 <div class="chart" aria-label="14 הימים האחרונים">${last.map(([v,b])=>`<div><i class="${v>b?'over':v>0?'v':''}" style="height:${v/cm*100}%"></i></div>`).join('')}</div>
 <div class="xs" style="margin-top:6px;display:flex;justify-content:space-between"><span>לפני שבועיים</span><span>היום</span></div>
 <div class="owe">${debt<1?`<b>אתם מאוזנים</b><span class="xs">אף אחד לא חייב כלום</span>`:`<span class="xs">מי חייב למי</span><b>${nm(deb)} חייב ל${nm(cre)} <span class="num">${ils(debt)}</span></b><button class="btn line" data-settle="${deb}:${Math.round(debt)}">סגרנו חשבון</button>`}</div>
 <div style="margin-top:14px">${ledger('החודש',ils(mon))}${ledger('מתחילת הטיול',ils(tot))}${[0,1].map(j=>ledger('החלק של '+nm(j),ils(all.reduce((a,e)=>a+share(e,j),0)))).join('')}</div>
 ${byLeg.length?sh('לפי מדינה')+byLeg.map(x=>`<div class="r" style="display:block"><div style="display:flex;justify-content:space-between"><span>${esc(x.l.R.n)}</span><span class="num sm"><b style="color:${x.pp>x.b?'var(--acc)':'var(--good)'}">${ils(x.pp)}</b> <span class="mute">/ ${ils(x.b)} ליום לאדם</span></span></div>${bar(x.pp/x.b,x.pp>x.b?'acc':'good')}</div>`).join(''):''}
 ${byCat.length?sh('לאן הלך הכסף')+byCat.map(([c,v])=>ledger(c,ils(v))).join(''):''}
 ${sh('רישומים',AL.length?'exp':'')}
 ${list.map(e=>`<div class="r"><span class="mute">${I(e.settle?'wallet':CI[e.cat]||'dots')}</span><span class="t">${e.settle?'החזר חוב: '+nm(e.pay)+' ← '+nm(e.for):esc(e.n||e.cat)}<small>${fmtD(D(e.dt))}${e.settle?'':' · '+esc(e.cat)+' · '+(e.pay!==undefined?'שילם '+nm(e.pay)+' · ':'')+((e.for??e.who)===2?'לשניכם':'עבור '+nm(e.for??e.who))}</small></span><span style="text-align:left"><span class="v num">${esc(e.c)}${esc(fmtN(e.a))}</span>${e.c!=='₪'?`<small class="xs num" style="display:block">${ils(toIls(e))}</small>`:''}</span>${edit==='exp'?`<button class="del" data-dex="${esc(e.id)}">מחיקה</button>`:''}</div>`).join('')||'<div class="empty">היומן ריק בינתיים.</div>'}
 ${AL.length>8?`<button class="tlink" data-more>${showAll?'פחות':'כל '+AL.length+' הרישומים'}</button>`:''}
 <details style="margin-top:20px"><summary>תקציב ומטבעות<span class="pm">+</span></summary><div class="dbody">
  <p class="xs" style="margin:0 0 6px">התקציב היומי נקבע לפי המדינה שאתם בה. מחוץ למסלול משתמשים בתקציב הזה:</p>
  ${r('תקציב יומי לאדם','₪, כשאין יעד',inp('daily',S.daily))}${Object.entries(S.rates).filter(([c])=>c!=='₪').map(([c,v])=>r('שער '+esc(c),'₪ ל-1 · שער משוער, לעדכן',`<input type="text" inputmode="decimal" data-fmt data-rate="${esc(c)}" value="${esc(fmtN(v))}">`)).join('')}
  <form class="add" data-add="rate"><input name="c" placeholder="מטבע חדש" required maxlength="5"><input name="v" type="number" step="any" inputmode="decimal" placeholder="שער" required style="width:90px;flex:none"><button>הוספה</button></form></div></details>
 <details><summary>שמות ותאריכים<span class="pm">+</span></summary><div class="dbody">${r('אני','',inp('names.0',S.names[0],'text'))}${r('החבר','',inp('names.1',S.names[1],'text'))}${r('שחרור','',inp('dis',S.dis,'date'))}${r('טיסה','',inp('dep',S.dep,'date'))}</div></details>`}

const VIEWS={home,money,route,trip,prep};
function render(){if(tab==='places')tab='route';if(tab==='gear'||tab==='insure'){prepTab=tab==='gear'?'gear':'ins';tab='prep'}if(!VIEWS[tab])tab='home';
 const ds=[...view.querySelectorAll('details')].map(d=>d.open);
 view.innerHTML=VIEWS[tab]();view.querySelectorAll('details').forEach((d,j)=>{if(ds[j])d.open=true});
 $('nav').innerHTML=TABS.map(([h,n])=>`<a href="#${h}" class="${h===tab||(tab==='prep'&&h==='home')?'on':''}">${n}</a>`).join('');
 $('fab').hidden=tab!=='trip'}
function segs(){$('paySeg').innerHTML=[0,1].map(j=>`<button type="button" data-pay="${j}" class="${j===form.pay?'on':''}">${nm(j)}</button>`).join('');
 $('forSeg').innerHTML=[nm(0),nm(1),'שנינו'].map((n,j)=>`<button type="button" data-for="${j}" class="${j===form.for?'on':''}">${n}</button>`).join('')}
function curFor(dt){const l=legAt(dt);if(l&&CUR[l.k]){const[c,rt]=CUR[l.k];if(S.rates[c]===undefined){S.rates[c]=rt;save()}form.cur=c}
 $('cur').innerHTML=Object.keys(S.rates).map(c=>`<option ${c===form.cur?'selected':''}>${esc(c)}</option>`).join('')}
function sheet(open){document.body.classList.toggle('open',open);if(open){
 $('cur').innerHTML=Object.keys(S.rates).map(c=>`<option ${c===form.cur?'selected':''}>${esc(c)}</option>`).join('');
 $('cats').innerHTML=CATS.map(c=>`<button type="button" data-cat="${c}" class="${c===form.cat?'on':''}">${I(CI[c])}${c}</button>`).join('');
 form.pay=me;segs();
 $('dt').value=today();curFor(today());setTimeout(()=>$('exf').a.focus(),300)}}
const setSync=()=>{const a=view.querySelector('.av');if(a)a.classList.toggle('ok',!!mainRef)};

const setK=(key,v)=>{const p=key.split('.');if(p.length>1)S[p[0]][+p[1]]=v;else S[key]=v};
view.addEventListener('change',e=>{const el=e.target,d=el.dataset;
 if(d.k){setK(d.k,'fmt' in d?parseN(el.value):el.type==='number'?(+el.value||0):el.value);save();render()}
 else if(d.leg){const[id,f]=d.leg.split(':'),l=S.legs.find(x=>x.id===id);if(l){l[f]=el.value;if(f==='a'&&l.b<=l.a){const dd=D(l.a);dd.setDate(dd.getDate()+14);l.b=iso(dd)}save();render()}}
 else if(d.rate){S.rates[d.rate]=parseN(el.value);save();render()}});
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset||!('fmt' in el.dataset))return;const fe=el.value.length-(el.selectionStart??el.value.length);const nv=fmtN(el.value);if(nv!==el.value){el.value=nv;const pos=Math.max(0,nv.length-fe);try{el.setSelectionRange(pos,pos)}catch(_){}}});
document.addEventListener('click',e=>{if(e.target.closest('[data-close]')){sheet(false);return}
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(b.id==='fab')sheet(true);
 else if('me' in d){me=1-me;pv=me;ls.set('trip.me',me);render();toast('מחובר כ'+S.names[me])}
 else if(d.del){const[kk,id]=d.del.split(':');S[kk]=S[kk].filter(x=>x.id!==id);save();render()}
 else if(d.chk){const[kk,id,j]=d.chk.split(':'),x=S[kk].find(y=>y.id===id);if(x){x.d[+j]=!x.d[+j];save();render()}}
 else if(d.todo){const x=S.todo.find(y=>y.id===d.todo);if(x){x.done=!x.done;save();render();if(x.done)toast('סומן כבוצע')}}
 else if(d.tog){const[kk,j]=d.tog.split('.');S[kk][+j]=!S[kk][+j];save();render()}
 else if(d.ck){ckStyle=d.ck;ls.set('trip.ck',ckStyle);applyCk();render()}
 else if('pick' in d){showPick=!showPick;render()}
 else if(d.pv){pv=+d.pv;render()}
 else if(d.prep){prepTab=d.prep;edit=null;render()}
 else if(d.edit){edit=edit===d.edit?null:d.edit;render()}
 else if('more' in d){showAll=!showAll;render()}
 else if('addleg' in d){const lp=legPlan(),a=lp.length?iso(lp[lp.length-1].e):S.dep,dd=D(a);dd.setDate(dd.getDate()+30);const l={id:uid(),r:'thailand',p:'',a,b:iso(dd)};S.legs.push(l);editLeg=l.id;save();render();setTimeout(()=>{const el=view.querySelector('[data-leg="'+l.id+':r"]');if(el)el.scrollIntoView({block:'center',behavior:'smooth'})},50)}
 else if(d.editleg){editLeg=editLeg===d.editleg?null:d.editleg;render()}
 else if(d.cat){form.cat=d.cat;$('cats').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))}
 else if(d.pay){form.pay=+d.pay;segs()}
 else if(d.for){form.for=+d.for;segs()}
 else if(d.auto){S.autoDone=S.autoDone||{};S.autoDone[d.auto]=!S.autoDone[d.auto];save();render();if(S.autoDone[d.auto])toast('סומן כבוצע')}
 else if(d.addgear){S.gear.push({id:uid(),cat:'לפי המסלול',t:d.addgear,d:[false,false]});save();render();toast('נוסף לרשימה')}
 else if('addallgear' in d){for(const t of gearSuggest())S.gear.push({id:uid(),cat:'לפי המסלול',t,d:[false,false]});save();render();toast('נוסף לרשימה')}
 else if(d.settle){const[db,am]=d.settle.split(':').map(Number);addExp({id:uid(),settle:1,a:am,c:'₪',cat:'החזר',pay:db,for:1-db,dt:today(),ts:Date.now()});toast('החשבון נסגר')}
 else if(d.dex){delExp(d.dex)}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,v=Object.fromEntries(new FormData(f));
 if(f.id==='exf'){const a=parseN(v.a);if(!a)return;form.cur=v.c;addExp({id:uid(),a,c:v.c,cat:form.cat,pay:form.pay,for:form.for,who:form.for,dt:v.dt||today(),n:(v.n||'').slice(0,80),ts:Date.now()});f.reset();sheet(false);toast('נרשם ביומן');return}
 const kk=f.dataset.add;if(!kk)return;if(kk==='rate'){const c=v.c.trim();if(c)S.rates[c]=+v.v||0}
 else if(kk==='fl'){S.fl=S.fl||[];S.fl.push({id:uid(),r:v.r.slice(0,80),d:v.d||'',p:parseN(v.p),s:(v.s||'').slice(0,60)})}
 else if(kk==='todo')S.todo.push({id:uid(),b:'dep',o:+v.o,t:v.t,done:false});
 else S[kk].push({id:uid(),cat:v.cat||'',t:v.t,d:[false,false]});save();render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')sheet(false)});
$('dt').addEventListener('change',e=>curFor(e.target.value));
async function addExp(x){if(expCol){try{await expCol.doc(x.id).set(x)}catch(e){toast('השמירה נכשלה')}}else{EXP.push(x);ls.set('trip.e',EXP);render()}}
async function delExp(id){if(expCol){try{await expCol.doc(id).delete()}catch(e){}}else{EXP=EXP.filter(x=>x.id!==id);ls.set('trip.e',EXP);render()}}

window.addEventListener('hashchange',()=>{tab=location.hash.slice(1)||'home';edit=null;editLeg=null;showAll=false;render();scrollTo(0,0)});
const typing=()=>{const a=document.activeElement;return a&&(view.contains(a)||$('exf').contains(a))&&/INPUT|SELECT/.test(a.tagName)};
const applyCk=()=>{document.body.className=document.body.className.replace(/\bck-\w+/g,'').trim();if(ckStyle!=='sq')document.body.classList.add('ck-'+ckStyle)};applyCk();
$('fab').innerHTML=I('plus')+'הוצאה חדשה';render();

const SB='https://mhlxgtbaiasmhcfamdns.supabase.co',KEY='sb_publishable__EkvIve2e9kLU_rb2lSjUg_C4lIKD_w';
const qs=new URLSearchParams(location.search);let CODE=qs.get('t')||ls.get('trip.code');if(qs.get('t'))ls.set('trip.code',CODE);
async function rpc(fn,body){const r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(r.status);const tx=await r.text();return tx?JSON.parse(tx):null}
let lastAt=0;
async function pull(force){if(!CODE)return;if(!force&&(dirty||writing||document.hidden||typing()||document.body.classList.contains('open')))return;
 try{const d=await rpc('trip_get',{p_code:CODE});if(!d){setSyncOff();return}
  if(force||d.at!==lastAt){lastAt=d.at;if(!dirty&&!writing){S=mig(Object.assign(def(),d.state||{}));ls.set('trip.s',S)}EXP=(d.exps||[]).filter(x=>x.dt);ls.set('trip.e',EXP);render()}
  if(!mainRef){mainRef={set:o=>rpc('trip_save',{p_code:CODE,p_state:o.s})};expCol={doc:id=>({set:x=>rpc('exp_put',{p_code:CODE,p_id:id,p_data:x}).then(()=>pull(1)),delete:()=>rpc('exp_del',{p_code:CODE,p_id:id}).then(()=>pull(1))})};setSync()}}
 catch(err){}}
function setSyncOff(){mainRef=null;expCol=null;setSync()}
if(CODE){pull(1);setInterval(()=>pull(0),6000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull(0)})}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
